[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "self-observatory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyYAML>=6,<7", "tzdata>=2025.2", "pypdf>=6,<7", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
self-observatory = "self_observatory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/self_observatory"]
