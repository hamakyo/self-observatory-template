name: Validate knowledge schema

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check text for direct identifiers and secret-like material
        run: python scripts/check_sensitive_data.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Validate frontmatter
        run: uv run python scripts/validate_frontmatter.py
      - name: Validate new feedback against the adopted base
        env:
          FEEDBACK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$FEEDBACK_BASE" ] && [ "$FEEDBACK_BASE" != "0000000000000000000000000000000000000000" ]; then
            uv run self-observatory validate-feedback --base "$FEEDBACK_BASE"
          fi
      - name: Backend tests
        run: uv run pytest -q
